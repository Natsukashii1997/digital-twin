<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数字分身工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
<style>
/* 版式：侧栏外壳（四组八个入口）。首页：刊头 + 等距系统图，往下是拍板清单行，再分主栏（工作流）和窄栏（今日运行、托管、自动化）。汇报页：数字条 + 一夜时间轴 + 黑底拍板卡片 + 逐件白话叙述 + 额度条 */
@font-face{font-family:"BM";src:local("Berkeley Mono"),local("BerkeleyMono-Regular"),local("TX-02"),local("TX-02 Regular"),local("TX02-Regular");font-weight:400;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"BM";src:local("Berkeley Mono Bold"),local("BerkeleyMono-Bold"),local("TX-02 Bold"),local("TX02-Bold");font-weight:700;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#EDEDEB; --panel:#F4F4F2; --side:#E5E5E2; --ink:#161616; --mute:#686864; --line:#C8C8C3; --dot:#C2C2BD; --chip:#DEDEDA; --mid:#8E8E89;
  --strip:#161616; --on-strip:#ECECEA;
  --accent:#E4502A; --acc-soft:#FBE4DB; --on-accent:#FFFFFF;
  --ok:#3A9F47; --warn:#CF8C12; --bad:#CC3A2C;
  --f-top:#FBFBFA; --f-l:#E2E2DF; --f-r:#D0D0CC; --ghost:#B3B3AE;
  --slab:#1A1A1A; --slab-top:#F5F5F3; --on-slab:#F5F5F3;
  --acc-top:#FFF7F3; --acc-l:#FADFD4; --acc-r:#F3CABB;
  --mono:"BM","Berkeley Mono","TX-02","JetBrains Mono",ui-monospace,"SF Mono",Menlo,"PingFang SC","Hiragino Sans GB","Noto Sans SC",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111211; --panel:#191A19; --side:#161716; --ink:#E8E8E4; --mute:#9A9A95; --line:#353634; --dot:#30312F; --chip:#2A2B29; --mid:#6E6F6B;
  --strip:#050505; --on-strip:#E8E8E4;
  --accent:#FF6A3E; --acc-soft:#3A1F16; --on-accent:#141414;
  --ok:#55BF64; --warn:#E5A93A; --bad:#F2604F;
  --f-top:#242523; --f-l:#1C1D1C; --f-r:#161716; --ghost:#4B4C49;
  --slab:#E3E3DF; --slab-top:#222321; --on-slab:#161616;
  --acc-top:#2F1D15; --acc-l:#3B2117; --acc-r:#2B1810; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111211; --panel:#191A19; --side:#161716; --ink:#E8E8E4; --mute:#9A9A95; --line:#353634; --dot:#30312F; --chip:#2A2B29; --mid:#6E6F6B;
  --strip:#050505; --on-strip:#E8E8E4;
  --accent:#FF6A3E; --acc-soft:#3A1F16; --on-accent:#141414;
  --ok:#55BF64; --warn:#E5A93A; --bad:#F2604F;
  --f-top:#242523; --f-l:#1C1D1C; --f-r:#161716; --ghost:#4B4C49;
  --slab:#E3E3DF; --slab-top:#222321; --on-slab:#161616;
  --acc-top:#2F1D15; --acc-l:#3B2117; --acc-r:#2B1810; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.sq{display:inline-block;width:8px;height:8px;background:var(--accent);flex:none}
.dots{background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:12px 12px}

/* ===== 外壳 ===== */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}
.side{background:var(--side);border-right:1px solid var(--ink);display:flex;flex-direction:column;overflow:auto;padding:18px 0 14px max(0px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;padding:0 18px 18px;border-bottom:1px solid var(--line)}
.brand svg{width:28px;height:28px;flex:none}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.nav{list-style:none;margin:12px 0 0;padding:0 10px;display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;color:inherit;text-decoration:none;font-size:13px}
.nav a:hover{background:var(--chip)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav .ico{width:12px;height:12px;flex:none;border:1px solid currentColor}
.nav .ico.fill{background:currentColor}
.nav .n{margin-left:auto;font-size:12px;color:var(--mute)}
.nav a[aria-current="page"] .n{color:var(--bg)}
.nav .n.hot{background:var(--accent);color:var(--on-accent);padding:0 6px}
.nav .grp{font-size:11px;color:var(--mute);padding:14px 10px 4px;letter-spacing:.06em;display:flex;gap:8px;align-items:center}
.nav .grp i{flex:1;height:1px;background:var(--line)}
.side .foot{margin-top:auto;padding:14px 18px 0;border-top:1px solid var(--line);font-size:11px;color:var(--mute);display:grid;gap:8px}
.side .leds{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.side .leds span,.side .sys span{display:inline-flex;align-items:center;gap:4px}
.side .sys{display:flex;gap:10px;flex-wrap:wrap}

.main{overflow:auto;min-width:0;scroll-behavior:smooth}
.bar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--ink)}
.bar .in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.bar h1{font-size:15px}
.bar .when{font-size:12px;color:var(--mute)}
.bar .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{border:1px solid var(--line);background:var(--panel);padding:4px 10px;font-size:12px;color:var(--mute);min-width:220px}
.pad{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.content{display:grid;grid-template-columns:minmax(0,1fr);gap:48px;padding-block:26px 72px;max-width:1380px}

/* ===== 通用件 ===== */
.label{display:inline-block;background:var(--chip);padding:0 5px;font-size:12px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:transparent;padding:5px 11px;font-size:13px;cursor:pointer;position:relative;white-space:nowrap}
.btn:hover{background:var(--chip)}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.pri:hover{background:var(--ink)}
.btn.link{border-color:transparent;text-decoration:underline;text-underline-offset:3px;padding-inline:4px}
.btn.cta{font-size:19px;padding:14px 22px;font-weight:700;letter-spacing:.02em}
.btn.cta::after{content:"";position:absolute;left:-7px;top:6px;width:100%;height:100%;z-index:-1;background:repeating-linear-gradient(135deg,var(--ink) 0 1px,transparent 1px 4px)}
.flag{display:inline-block;font-size:11px;border:1px solid var(--accent);color:var(--accent);padding:0 5px;white-space:nowrap}
.flag.warn{border-color:var(--warn);color:var(--warn);white-space:normal}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.led.off{background:transparent;border:1.5px solid var(--mute)}
.led.warn{background:var(--warn)}
.led.draft{background:transparent;border:1.5px dashed var(--accent)}
.res{display:inline-flex;align-items:center;gap:6px}
.res i{width:8px;height:8px;display:inline-block;background:var(--ok);flex:none}
.res.warn i{background:var(--warn)} .res.wait i{background:transparent;border:1.5px solid var(--ink)} .res.off i{background:transparent;border:1.5px solid var(--mute)}
.tier{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.tier b{display:inline-grid;place-items:center;width:18px;height:18px;border:1px solid var(--ink);font-size:11px}
.tier.t-D b{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.code{display:inline-grid;place-items:center;min-width:22px;height:17px;padding:0 3px;font-size:10px;font-weight:700;border:1px solid var(--ink);background:var(--f-top);line-height:1;flex:none}
.code.ink{background:var(--ink);color:var(--bg)}
.code.mid{background:var(--mid);color:var(--bg)}
.code.none{border-style:dashed;color:var(--mute);font-weight:400;background:transparent}
.arrow{display:inline-grid;place-items:center;width:15px;height:15px;background:var(--ink);color:var(--bg);font-size:10px;line-height:1;flex:none}
.hl{background:var(--chip);padding:0 4px}

/* 区块标题：大小分三级 */
.h-sec{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.h-sec h2{font-size:22px;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.h-sec .hint{font-size:12px;color:var(--mute)}
.h-sec .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.h-rail{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:12px}
.h-rail h3{font-size:14px;display:flex;align-items:center;gap:8px}
.h-rail .more{margin-left:auto;font-size:12px;color:var(--mute);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* ===== 刊头 ===== */
.hero{position:relative}
.hero .top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:20px;border-right:1px solid var(--mute);padding-right:20px}
.badge{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:6px 14px 6px 6px;font-size:13px;letter-spacing:.08em;border:0;cursor:pointer;width:max-content}
.badge b{background:var(--accent);color:var(--on-accent);padding:0 7px}
.hero h1{font-size:clamp(40px,4.6vw,66px);line-height:1.04;letter-spacing:-.015em;margin-top:22px;font-weight:800}
.hero .stamp{font-size:12px;color:var(--mute);text-align:right;line-height:1.7;padding-bottom:10px}
.hero .stamp b{color:var(--ink);font-weight:500}
.stage{position:relative;margin-top:28px;border-top:1px solid var(--mute);border-right:1px solid var(--mute);display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);min-height:440px}
.stage .copy{padding:22px 24px 22px 0;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
.stage .copy .lede{font-size:15px;padding-bottom:14px;border-bottom:1px solid var(--mute);max-width:26em}
.stage .copy ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.stage .copy li{display:flex;gap:8px;align-items:center}
.spec{margin-top:auto;font-size:11px;border:1px solid var(--ink);background:var(--panel);width:100%;max-width:300px}
.spec .hd{display:flex;justify-content:space-between;padding:5px 8px;border-bottom:1px solid var(--ink);font-weight:700}
.spec .hd span{font-weight:400;color:var(--mute)}
.spec table{border-collapse:collapse;width:100%}
.spec td{padding:4px 7px;border-bottom:1px dashed var(--line);white-space:nowrap}
.spec td:last-child{padding-right:9px}
.spec tr:last-child td{border-bottom:0}
.spec td{vertical-align:top}
.spec .m{color:var(--mute);font-size:10px}
.spec td:nth-child(2){width:100%}
.stage .art{position:relative;display:flex;align-items:center;justify-content:center;padding:10px 6px 10px 0}
.stage .art svg{width:100%}
.down{position:absolute;right:-1px;bottom:-1px;width:40px;height:40px;border:1px solid var(--ink);background:var(--bg);display:grid;place-items:center;cursor:pointer;font-size:16px}
.down:hover{background:var(--chip)}
.hero .foot{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:22px}
.hero .foot .matrix{width:min(560px,100%)}
.hero .foot .go{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:flex-end}
.hero .foot .go p{font-size:12px;color:var(--mute);max-width:15em;text-align:right}

/* ===== 等我拍板 ===== */
.decide{background:var(--strip);color:var(--on-strip);padding:20px 22px 22px;border:1px solid var(--line);scroll-margin-top:60px}
.decide .hd{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:16px}
.decide h2{font-size:22px;display:flex;gap:10px;align-items:center}
.decide .hd .count{background:var(--accent);color:var(--on-accent);padding:0 7px;font-size:15px}
.decide .hd .hint{font-size:12px;opacity:.65}
.dcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}
.dc{background:var(--bg);color:var(--ink);border:1px solid var(--ink);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.dc.change{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.dc .top{display:flex;gap:8px;align-items:center;font-size:12px;min-height:22px}
.dc .kind{background:var(--ink);color:var(--bg);padding:1px 6px;white-space:nowrap}
.dc.change .kind{background:var(--accent);color:var(--on-accent)}
.dc .age{margin-left:auto;color:var(--mute);white-space:nowrap}
.dc h3{font-size:14px;line-height:1.45;height:2.9em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dc .ask{font-size:13px;line-height:1.55;height:4.65em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.dc .detail{flex:1;border-collapse:collapse;font-size:12px;width:100%}
.dc .detail td{border-top:1px dashed var(--line);padding:5px 6px 5px 0;vertical-align:top;height:2.4em}
.dc .detail td:first-child{color:var(--mute);width:4.2em;white-space:nowrap}
.dc .detail tr:last-child td{border-bottom:1px dashed var(--line)}
.dc del{color:var(--mute)}
.dc ins{text-decoration:none;background:var(--acc-soft);padding:0 3px}
.dc .from{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc .acts{display:flex;gap:8px;align-items:center;min-height:32px}
.dc .acts .btn.link{margin-left:auto}
.dc .done{display:none;font-size:12px;color:var(--ok);min-height:32px;align-items:center}
.dc[data-done] .acts{display:none}
.dc[data-done] .done{display:flex}


/* ===== 首页的等我拍板：清单行（黑底四卡的形式在汇报页） ===== */
.btn.inv{border-color:var(--on-strip);color:var(--on-strip)}
.btn.inv:hover{background:var(--on-strip);color:var(--strip)}
.dlist{border:1px solid var(--ink);scroll-margin-top:60px}
.dlist .hd{background:var(--strip);color:var(--on-strip);display:flex;align-items:center;gap:14px;padding:10px 16px}
.dlist .hd h2{font-size:17px;display:flex;gap:10px;align-items:center}
.dlist .hd .count{background:var(--accent);color:var(--on-accent);padding:0 7px;font-size:14px}
.dlist .hd .hint{font-size:12px;opacity:.65}
.dlist .hd .btn{margin-left:auto}
.drow{display:grid;grid-template-columns:96px minmax(0,1fr) 124px 84px 200px;gap:16px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);background:var(--bg)}
.drow.change{box-shadow:inset 3px 0 0 var(--accent)}
.drow .kind{background:var(--ink);color:var(--bg);padding:1px 6px;font-size:12px;justify-self:start;white-space:nowrap}
.drow.change .kind{background:var(--accent);color:var(--on-accent)}
.drow .tx{min-width:0}
.drow .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .tx span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .age{font-size:12px;color:var(--mute);white-space:nowrap}
.drow .acts{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.drow .done{display:none;font-size:12px;color:var(--ok);justify-content:flex-end}
.drow[data-done] .acts{display:none}
.drow[data-done] .done{display:flex}

/* ===== 汇报页：数字条、时间轴、逐件叙述、额度条 ===== */
.hb{display:grid;gap:36px}
.hb-tabs{display:flex;gap:0;border:1px solid var(--ink);width:max-content;font-size:12px}
.hb-tabs span{padding:4px 12px;display:inline-flex;gap:8px;align-items:center;color:var(--mute)}
.hb-tabs span+span{border-left:1px solid var(--line)}
.hb-tabs span.on{background:var(--ink);color:var(--bg)}
.hb-eye{font-size:12px;color:var(--mute);letter-spacing:.04em}
.hb-sum{display:grid;gap:18px}
.hb-kpi{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--ink);background:var(--panel)}
.hb-kpi>div{padding:12px 14px 10px;display:grid;gap:2px;align-content:start}
.hb-kpi>div+div{border-left:1px solid var(--line)}
.hb-kpi b{font-size:40px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.hb-kpi b small{font-size:15px;font-weight:400;margin-left:3px}
.hb-kpi span{font-size:13px}
.hb-kpi i{font-style:normal;font-size:11px;color:var(--mute)}
.hb-kpi .me{background:var(--acc-soft)}
.hb-kpi .me b{color:var(--accent)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap;border:1px solid var(--ink);padding:0 7px;background:var(--bg)}
.st i{width:8px;height:8px;flex:none;background:var(--ok)}
.st.me{border-color:var(--accent);color:var(--accent)} .st.me i{background:var(--accent)}
.st.warn i{background:var(--warn)}
.prog{display:inline-flex;gap:3px;vertical-align:-1px;margin:0 4px}
.prog i{width:10px;height:10px;border:1px solid var(--ink);display:inline-block}
.prog i.f{background:var(--ink)} .prog i.n{background:var(--ok);border-color:var(--ok)}
.gantt{border:1px solid var(--ink);background:var(--panel);padding:10px 14px 8px}
.gantt svg{display:block;width:100%;height:auto;overflow:visible}
.gantt text{font-family:var(--mono);fill:var(--ink)}
.gantt .tm{fill:var(--mute)}
.gantt .grid{stroke:var(--line);stroke-dasharray:2 3}
.gantt .axis{stroke:var(--ink)}
.gantt .run-cc{fill:var(--ink)} .gantt .run-cx{fill:var(--mid)}
.gantt .rev{fill:url(#hatch2);stroke:var(--ink)}
.gantt .waitme{fill:var(--acc-soft);stroke:var(--accent);stroke-dasharray:4 3}
.gantt .mk-sec{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.gantt .mk-ok{fill:var(--ok);stroke:var(--panel);stroke-width:2}
.gantt .mk-stop{stroke:var(--warn);stroke-width:2.5}
.gantt .mk-me{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.gantt .mk-out{fill:var(--ink)}
.gantt .on{fill:var(--bg);font-weight:700}
.gantt .lane{fill:var(--chip);opacity:.5}
.gantt .hit:hover{opacity:.8}
.lg{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px;align-items:center}
.lg span{display:inline-flex;gap:6px;align-items:center}
.lg svg{width:22px;height:12px;flex:none}
.gen{font-size:11px;color:var(--mute)}
.mlg{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap}
mark.mkd{background:var(--acc-soft);color:inherit;padding:1px 3px;box-shadow:inset 0 -2px 0 var(--accent)}
mark.mkn{background:transparent;color:inherit;padding:1px 3px;border-bottom:2px dashed var(--accent)}
u.ac{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.inl{font:inherit;font-size:11px;border:1px solid var(--line);background:var(--bg);color:var(--mute);padding:0 5px;margin:0 2px 0 5px;cursor:pointer;vertical-align:1px;line-height:1.5}
.inl:hover{border-color:var(--ink);color:var(--ink)}
.inl.go{border-color:var(--accent);color:var(--accent)}

const K=0.8660254,H=0.5;
class Iso{
  constructor(){this.p=[];this.b=[1e9,1e9,-1e9,-1e9]}
  pt(x,y,z){const X=(x-y)*K,Y=(x+y)*H-z;this.tr(X,Y);return[X,Y]}
  tr(X,Y){const b=this.b;if(X<b[0])b[0]=X;if(Y<b[1])b[1]=Y;if(X>b[2])b[2]=X;if(Y>b[3])b[3]=Y}
  poly(a,c){this.p.push(`<polygon class="${c}" points="${a.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}"/>`)}
  box(x,y,z,w,d,h,k){
    const t=[this.pt(x,y,z+h),this.pt(x+w,y,z+h),this.pt(x+w,y+d,z+h),this.pt(x,y+d,z+h)];
    const l=[this.pt(x,y+d,z+h),this.pt(x+w,y+d,z+h),this.pt(x+w,y+d,z),this.pt(x,y+d,z)];
    const r=[this.pt(x+w,y,z+h),this.pt(x+w,y+d,z+h),this.pt(x+w,y+d,z),this.pt(x+w,y,z)];
    if(k==='ghost'||k==='ghosta'){this.poly(l,k);this.poly(r,k);this.poly(t,k);return}
    this.poly(l,k+' fl');this.poly(r,k+' fr');this.poly(t,k+' ft');
  }
  tile(x,y,z,w,d,k){this.poly([this.pt(x,y,z),this.pt(x+w,y,z),this.pt(x+w,y+d,z),this.pt(x,y+d,z)],k)}
  top(x,y,z,s,size,c){const[e,f]=this.pt(x,y,z);this.p.push(`<text class="${c}" font-size="${size}" transform="matrix(${K},${H},${-K},${H},${e.toFixed(1)},${f.toFixed(1)})">${s}</text>`)}
  side(x,y,z,s,size,c){const[e,f]=this.pt(x,y,z);this.p.push(`<text class="${c}" font-size="${size}" transform="matrix(${K},${H},0,1,${e.toFixed(1)},${f.toFixed(1)})">${s}</text>`)}
  rside(x,y,z,s,size,c){const[e,f]=this.pt(x,y,z);this.p.push(`<text class="${c}" font-size="${size}" transform="matrix(${K},${-H},0,1,${e.toFixed(1)},${f.toFixed(1)})">${s}</text>`)}
  dot(x,y,z,r,c){const[e,f]=this.pt(x,y,z);this.p.push(`<ellipse class="${c}" cx="${e.toFixed(1)}" cy="${f.toFixed(1)}" rx="${(r*1.2).toFixed(1)}" ry="${(r*.7).toFixed(1)}"/>`)}
  sqTop(x,y,z,s,c){this.poly([this.pt(x,y,z),this.pt(x+s,y,z),this.pt(x+s,y+s,z),this.pt(x,y+s,z)],c)}
  line(a,c){const q=a.map(v=>this.pt(...v));this.p.push(`<path class="${c}" d="M${q.map(v=>v[0].toFixed(1)+' '+v[1].toFixed(1)).join(' L')}"/>`)}
  flat(X,Y,s,size,c){const w=[...s].reduce((a,ch)=>a+(ch.charCodeAt(0)>0x2e80?1:.62),0)*size;this.tr(X,Y-size);this.tr(X+w,Y+4);this.p.push(`<text class="${c}" font-size="${size}" x="${X.toFixed(1)}" y="${Y.toFixed(1)}">${s}</text>`)}
  raw(s){this.p.push(s)}
  svg(pad,label,natural){const b=this.b,w=b[2]-b[0]+pad*2,h=b[3]-b[1]+pad*2;return `<svg class="iso" ${natural?`style="width:${w.toFixed(0)}px"`:''} viewBox="${(b[0]-pad).toFixed(1)} ${(b[1]-pad).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" role="img" aria-label="${label}">${this.p.join('')}</svg>`}
}

function roleCube(g,x,y,role,s,h,ghost){
  const r=R[role]; const k=ghost?(role==='me'?'ghosta':'ghost'):r.k;
  g.box(x,y,0,s,s,h,k);
  g.side(x+5,y+s,h/2-4,r.code,11,role==='me'?'tacc':'tb');
}
function strip(wf){
  const g=new Iso(),s=34,h=16,step=s+12,ghost=wf.state==='draft';
  wf.steps.forEach(([role],i)=>{
    const x=i*step,y=-i*step;
    if(i>0) g.line([[x-step+s,y+step+s/2,0],[x,y+s/2,0]],'dashm');
    roleCube(g,x,y,role,s,h,ghost);
  });
  (wf.pins||[]).forEach(p=>{
    const x=p.at*step,y=-p.at*step; const[X,Y]=g.pt(x+s/2,y+s/2,h); const top=Y-18;
    g.tr(X-30,top-14); g.tr(X+30,top);
    g.raw(`<path class="${p.warn?'pinw':'pin'}" d="M${(X-4).toFixed(1)} ${top.toFixed(1)} L${(X+4).toFixed(1)} ${top.toFixed(1)} L${X.toFixed(1)} ${(top+6).toFixed(1)}Z"/><text x="${X.toFixed(1)}" y="${(top-3).toFixed(1)}" font-size="10" text-anchor="middle" class="${p.warn?'twarn':'tb'}">${p.text}</text>`);
  });
  return g.svg(6,wf.name+' 的角色顺序',true);
}
function cubeIcon(role){const g=new Iso();roleCube(g,0,0,role,24,10,false);return g.svg(2,R[role].name,false)}

function dotMatrix(word){
  const F={W:'10001100011000110101101011101110001',O:'01110100011000110001100011000101110',R:'11110100011000111110101001001010001',K:'10001100101010011000101001001010001',B:'11110100011000111110100011000111110',E:'11111100001000011110100001000011111',N:'10001110011010110011100011000110001',C:'01110100011000010000100001000101110',H:'10001100011000111111100011000110001'};
  const st=7,pad=2,cols=word.length*6-1+pad*2,rows=7+pad*2;let out='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const lc=c-pad,lr=r-pad,li=Math.floor(lc/6),lx=lc%6;
    const on=lr>=0&&lr<7&&lc>=0&&li<word.length&&lx<5&&F[word[li]][lr*5+lx]==='1';
    const hot=on&&((c*5+r*3)%17===0), halo=!on&&((c*7+r*11)%29===0);
    out+=`<rect x="${c*st}" y="${r*st}" width="${on?3:1.6}" height="${on?3:1.6}" class="${hot||halo?'dacc':on?'dink':''}" ${on||halo?'':'fill="var(--dot)"'}/>`;
  }
  return `<svg class="iso matrix" viewBox="-2 -2 ${cols*st} ${rows*st}" aria-hidden="true">${out}</svg>`;
}

function wfRow(w){
  const caps=w.steps.map(([r,t])=>`<em>${R[r].name}</em> ${t}`).join(' → ');

  const led = w.state==='draft'?'draft':(w.warn?'warn':'');
  return `<div class="wfr ${w.state==='draft'?'draft':''}">

const mm=s=>{const [h,m]=s.split(':').map(Number);return ((h<12?h+24:h)-22)*60+m};

function gantt(big){
  const W=1156, L=176, R=14, top=22, rh=big?40:26, bh=big?22:14;
  const lanes=[...NIGHT.tasks.map(t=>({t})),{lab:'秘书替你定'},{lab:'完成的动作'}];
  const H=top+lanes.length*rh+6, x=n=>L+n/600*(W-L-R);
  let o='';
  for(let h=0;h<=10;h++){const X=x(h*60);o+=`<line class="grid" x1="${X}" x2="${X}" y1="${top}" y2="${H-6}"/><text class="tm" x="${X}" y="13" font-size="11" text-anchor="middle">${String((22+h)%24).padStart(2,'0')}:00</text>`}
  o+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${top}" y2="${top}"/>`;
  lanes.forEach((ln,i)=>{
    const y=top+i*rh, cy=y+rh/2;

    if(ln.t){const t=ln.t;
      o+=`<text x="0" y="${cy+4}" font-size="12"><tspan font-weight="700">${t.n}</tspan>　${t.ref}</text>`;
      t.segs.forEach(s=>{const a=x(mm(s[1])), b=x(mm(s[2])), w=b-a-2;

        o+=`<rect class="hit ${cls}" x="${a}" y="${cy-bh/2}" width="${w}" height="${bh}" rx="${s[0]==='run'?2:0}"><title>第 ${t.n} 单 · ${name} · ${s[1]} → ${s[2]}</title></rect>`;
        if(big&&w>(s[0]==='run'?120:70)) o+=`<text class="${s[0]==='run'?'on':''}" x="${a+(s[0]==='wait'?18:7)}" y="${cy+4}" font-size="11">${name}${s[0]==='run'?' '+hm(mm(s[2])-mm(s[1])):''}</text>`;
        if(!big&&s[0]==='wait'&&w>60) o+=`<text x="${a+18}" y="${cy+4}" font-size="10" fill="var(--accent)">等你</text>`;
      });
      t.marks.forEach(mk=>{const X=x(mm(mk[1]));
