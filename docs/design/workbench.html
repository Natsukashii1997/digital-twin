<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数字分身工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
<style>
/* 版式：侧栏外壳（四组八个入口）。首页：刊头 + 等距系统图，往下是拍板清单行，再分主栏（工作流）和窄栏（今日运行、托管、自动化）。汇报页：数字条 + 一夜时间轴 + 黑底拍板卡片 + 逐件白话叙述 + 额度条。分身页：一张卡片走过的 8 道闸 + 右栏现在状态、授权四档、私聊口令 */
@font-face{font-family:"BM";src:local("Berkeley Mono"),local("BerkeleyMono-Regular"),local("TX-02"),local("TX-02 Regular"),local("TX02-Regular");font-weight:400;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"BM";src:local("Berkeley Mono Bold"),local("BerkeleyMono-Bold"),local("TX-02 Bold"),local("TX02-Bold");font-weight:700;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#EDEDEB; --panel:#F4F4F2; --side:#E5E5E2; --ink:#161616; --mute:#686864; --line:#C8C8C3; --dot:#C2C2BD; --chip:#DEDEDA; --mid:#8E8E89;
  --strip:#161616; --on-strip:#ECECEA;
  --accent:#E4502A; --acc-soft:#FBE4DB; --on-accent:#FFFFFF;
  --ok:#3A9F47; --warn:#CF8C12; --bad:#CC3A2C;
  --f-top:#FBFBFA; --f-l:#E2E2DF; --f-r:#D0D0CC; --ghost:#B3B3AE;
  --slab:#1A1A1A; --slab-top:#F5F5F3; --on-slab:#F5F5F3;
  --acc-top:#FFF7F3; --acc-l:#FADFD4; --acc-r:#F3CABB;
  --mono:"BM","Berkeley Mono","TX-02","JetBrains Mono",ui-monospace,"SF Mono",Menlo,"PingFang SC","Hiragino Sans GB","Noto Sans SC",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111211; --panel:#191A19; --side:#161716; --ink:#E8E8E4; --mute:#9A9A95; --line:#353634; --dot:#30312F; --chip:#2A2B29; --mid:#6E6F6B;
  --strip:#050505; --on-strip:#E8E8E4;
  --accent:#FF6A3E; --acc-soft:#3A1F16; --on-accent:#141414;
  --ok:#55BF64; --warn:#E5A93A; --bad:#F2604F;
  --f-top:#242523; --f-l:#1C1D1C; --f-r:#161716; --ghost:#4B4C49;
  --slab:#E3E3DF; --slab-top:#222321; --on-slab:#161616;
  --acc-top:#2F1D15; --acc-l:#3B2117; --acc-r:#2B1810; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111211; --panel:#191A19; --side:#161716; --ink:#E8E8E4; --mute:#9A9A95; --line:#353634; --dot:#30312F; --chip:#2A2B29; --mid:#6E6F6B;
  --strip:#050505; --on-strip:#E8E8E4;
  --accent:#FF6A3E; --acc-soft:#3A1F16; --on-accent:#141414;
  --ok:#55BF64; --warn:#E5A93A; --bad:#F2604F;
  --f-top:#242523; --f-l:#1C1D1C; --f-r:#161716; --ghost:#4B4C49;
  --slab:#E3E3DF; --slab-top:#222321; --on-slab:#161616;
  --acc-top:#2F1D15; --acc-l:#3B2117; --acc-r:#2B1810; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.sq{display:inline-block;width:8px;height:8px;background:var(--accent);flex:none}
.dots{background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:12px 12px}

/* ===== 外壳 ===== */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}
.side{background:var(--side);border-right:1px solid var(--ink);display:flex;flex-direction:column;overflow:auto;padding:18px 0 14px max(0px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;padding:0 18px 18px;border-bottom:1px solid var(--line)}
.brand svg{width:28px;height:28px;flex:none}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.nav{list-style:none;margin:12px 0 0;padding:0 10px;display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;color:inherit;text-decoration:none;font-size:13px}
.nav a:hover{background:var(--chip)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav .ico{width:12px;height:12px;flex:none;border:1px solid currentColor}
.nav .ico.fill{background:currentColor}
.nav .n{margin-left:auto;font-size:12px;color:var(--mute)}
.nav a[aria-current="page"] .n{color:var(--bg)}
.nav .n.hot{background:var(--accent);color:var(--on-accent);padding:0 6px}
.nav .grp{font-size:11px;color:var(--mute);padding:14px 10px 4px;letter-spacing:.06em;display:flex;gap:8px;align-items:center}
.nav .grp i{flex:1;height:1px;background:var(--line)}
.side .foot{margin-top:auto;padding:14px 18px 0;border-top:1px solid var(--line);font-size:11px;color:var(--mute);display:grid;gap:8px}
.side .leds{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.side .leds span,.side .sys span{display:inline-flex;align-items:center;gap:4px}
.side .sys{display:flex;gap:10px;flex-wrap:wrap}

.main{overflow:auto;min-width:0;scroll-behavior:smooth}
.bar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--ink)}
.bar .in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.bar h1{font-size:15px}
.bar .when{font-size:12px;color:var(--mute)}
.bar .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{border:1px solid var(--line);background:var(--panel);padding:4px 10px;font-size:12px;color:var(--mute);min-width:220px}
.pad{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.content{display:grid;grid-template-columns:minmax(0,1fr);gap:48px;padding-block:26px 72px;max-width:1380px}

/* ===== 通用件 ===== */
.label{display:inline-block;background:var(--chip);padding:0 5px;font-size:12px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:transparent;padding:5px 11px;font-size:13px;cursor:pointer;position:relative;white-space:nowrap}
.btn:hover{background:var(--chip)}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.pri:hover{background:var(--ink)}
.btn.link{border-color:transparent;text-decoration:underline;text-underline-offset:3px;padding-inline:4px}
.btn.cta{font-size:19px;padding:14px 22px;font-weight:700;letter-spacing:.02em}
.btn.cta::after{content:"";position:absolute;left:-7px;top:6px;width:100%;height:100%;z-index:-1;background:repeating-linear-gradient(135deg,var(--ink) 0 1px,transparent 1px 4px)}
.flag{display:inline-block;font-size:11px;border:1px solid var(--accent);color:var(--accent);padding:0 5px;white-space:nowrap}
.flag.warn{border-color:var(--warn);color:var(--warn);white-space:normal}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.led.off{background:transparent;border:1.5px solid var(--mute)}
.led.warn{background:var(--warn)}
.led.draft{background:transparent;border:1.5px dashed var(--accent)}
.res{display:inline-flex;align-items:center;gap:6px}
.res i{width:8px;height:8px;display:inline-block;background:var(--ok);flex:none}
.res.warn i{background:var(--warn)} .res.wait i{background:transparent;border:1.5px solid var(--ink)} .res.off i{background:transparent;border:1.5px solid var(--mute)}
.tier{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.tier b{display:inline-grid;place-items:center;width:18px;height:18px;border:1px solid var(--ink);font-size:11px}
.tier.t-D b{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.code{display:inline-grid;place-items:center;min-width:22px;height:17px;padding:0 3px;font-size:10px;font-weight:700;border:1px solid var(--ink);background:var(--f-top);line-height:1;flex:none}
.code.ink{background:var(--ink);color:var(--bg)}
.code.mid{background:var(--mid);color:var(--bg)}
.code.none{border-style:dashed;color:var(--mute);font-weight:400;background:transparent}
.arrow{display:inline-grid;place-items:center;width:15px;height:15px;background:var(--ink);color:var(--bg);font-size:10px;line-height:1;flex:none}
.hl{background:var(--chip);padding:0 4px}

/* 区块标题：大小分三级 */
.h-sec{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.h-sec h2{font-size:22px;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.h-sec .hint{font-size:12px;color:var(--mute)}
.h-sec .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.h-rail{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:12px}
.h-rail h3{font-size:14px;display:flex;align-items:center;gap:8px}
.h-rail .more{margin-left:auto;font-size:12px;color:var(--mute);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* ===== 刊头 ===== */
.hero{position:relative}
.hero .top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:20px;border-right:1px solid var(--mute);padding-right:20px}
.badge{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:6px 14px 6px 6px;font-size:13px;letter-spacing:.08em;border:0;cursor:pointer;width:max-content}
.badge b{background:var(--accent);color:var(--on-accent);padding:0 7px}
.hero h1{font-size:clamp(40px,4.6vw,66px);line-height:1.04;letter-spacing:-.015em;margin-top:22px;font-weight:800}
.hero .stamp{font-size:12px;color:var(--mute);text-align:right;line-height:1.7;padding-bottom:10px}
.hero .stamp b{color:var(--ink);font-weight:500}
.stage{position:relative;margin-top:28px;border-top:1px solid var(--mute);border-right:1px solid var(--mute);display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);min-height:440px}
.stage .copy{padding:22px 24px 22px 0;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
.stage .copy .lede{font-size:15px;padding-bottom:14px;border-bottom:1px solid var(--mute);max-width:26em}
.stage .copy ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.stage .copy li{display:flex;gap:8px;align-items:center}
.spec{margin-top:auto;font-size:11px;border:1px solid var(--ink);background:var(--panel);width:100%;max-width:300px}
.spec .hd{display:flex;justify-content:space-between;padding:5px 8px;border-bottom:1px solid var(--ink);font-weight:700}
.spec .hd span{font-weight:400;color:var(--mute)}
.spec table{border-collapse:collapse;width:100%}
.spec td{padding:4px 7px;border-bottom:1px dashed var(--line);white-space:nowrap}
.spec td:last-child{padding-right:9px}
.spec tr:last-child td{border-bottom:0}
.spec td{vertical-align:top}
.spec .m{color:var(--mute);font-size:10px}
.spec td:nth-child(2){width:100%}
.stage .art{position:relative;display:flex;align-items:center;justify-content:center;padding:10px 6px 10px 0}
.stage .art svg{width:100%}
.down{position:absolute;right:-1px;bottom:-1px;width:40px;height:40px;border:1px solid var(--ink);background:var(--bg);display:grid;place-items:center;cursor:pointer;font-size:16px}
.down:hover{background:var(--chip)}
.hero .foot{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:22px}
.hero .foot .matrix{width:min(560px,100%)}
.hero .foot .go{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:flex-end}
.hero .foot .go p{font-size:12px;color:var(--mute);max-width:15em;text-align:right}

/* ===== 等我拍板 ===== */
.decide{background:var(--strip);color:var(--on-strip);padding:20px 22px 22px;border:1px solid var(--line);scroll-margin-top:60px}
.decide .hd{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:16px}
.decide h2{font-size:22px;display:flex;gap:10px;align-items:center}
.decide .hd .count{background:var(--accent);color:var(--on-accent);padding:0 7px;font-size:15px}
.decide .hd .hint{font-size:12px;opacity:.65}
.dcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}
.dc{background:var(--bg);color:var(--ink);border:1px solid var(--ink);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.dc.change{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.dc .top{display:flex;gap:8px;align-items:center;font-size:12px;min-height:22px}
.dc .kind{background:var(--ink);color:var(--bg);padding:1px 6px;white-space:nowrap}
.dc.change .kind{background:var(--accent);color:var(--on-accent)}
.dc .age{margin-left:auto;color:var(--mute);white-space:nowrap}
.dc h3{font-size:14px;line-height:1.45;height:2.9em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dc .ask{font-size:13px;line-height:1.55;height:4.65em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.dc .detail{flex:1;border-collapse:collapse;font-size:12px;width:100%}
.dc .detail td{border-top:1px dashed var(--line);padding:5px 6px 5px 0;vertical-align:top;height:2.4em}
.dc .detail td:first-child{color:var(--mute);width:4.2em;white-space:nowrap}
.dc .detail tr:last-child td{border-bottom:1px dashed var(--line)}
.dc del{color:var(--mute)}
.dc ins{text-decoration:none;background:var(--acc-soft);padding:0 3px}
.dc .from{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc .acts{display:flex;gap:8px;align-items:center;min-height:32px;flex-wrap:wrap}
/* 按钮只算发起（常浩 2026-11-21 选甲）：动词前写「发起」，后面标「↗ 飞书」；真正批准在飞书门卫卡上点 */
.btn .fs{font-size:11px;opacity:.75;margin-left:2px}
.done .undo{font:inherit;border:0;background:none;color:var(--mute);text-decoration:underline;cursor:pointer;margin-left:6px;padding:0}
.dc .acts .btn.link{margin-left:auto}
.dc .done{display:none;font-size:12px;color:var(--ok);min-height:32px;align-items:center}
.dc[data-done] .acts{display:none}
.dc[data-done] .done{display:flex}


/* ===== 首页的等我拍板：清单行（黑底四卡的形式在汇报页） ===== */
.btn.inv{border-color:var(--on-strip);color:var(--on-strip)}
.btn.inv:hover{background:var(--on-strip);color:var(--strip)}
.dlist{border:1px solid var(--ink);scroll-margin-top:60px}
.dlist .hd{background:var(--strip);color:var(--on-strip);display:flex;align-items:center;gap:14px;padding:10px 16px}
.dlist .hd h2{font-size:17px;display:flex;gap:10px;align-items:center}
.dlist .hd .count{background:var(--accent);color:var(--on-accent);padding:0 7px;font-size:14px}
.dlist .hd .hint{font-size:12px;opacity:.65}
.dlist .hd .btn{margin-left:auto}
.drow{display:grid;grid-template-columns:96px minmax(0,1fr) 124px 84px 200px;gap:16px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);background:var(--bg)}
.drow.change{box-shadow:inset 3px 0 0 var(--accent)}
.drow .kind{background:var(--ink);color:var(--bg);padding:1px 6px;font-size:12px;justify-self:start;white-space:nowrap}
.drow.change .kind{background:var(--accent);color:var(--on-accent)}
.drow .tx{min-width:0}
.drow .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .tx span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .age{font-size:12px;color:var(--mute);white-space:nowrap}
.drow .acts{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.drow .done{display:none;font-size:12px;color:var(--ok);justify-content:flex-end}
.drow[data-done] .acts{display:none}
.drow[data-done] .done{display:flex}

/* ===== 汇报页：数字条、时间轴、逐件叙述、额度条 ===== */
.hb{display:grid;gap:36px}
.hb-tabs{display:flex;gap:0;border:1px solid var(--ink);width:max-content;font-size:12px}
.hb-tabs span{padding:4px 12px;display:inline-flex;gap:8px;align-items:center;color:var(--mute)}
.hb-tabs span+span{border-left:1px solid var(--line)}
.hb-tabs span.on{background:var(--ink);color:var(--bg)}
.hb-eye{font-size:12px;color:var(--mute);letter-spacing:.04em}
.hb-sum{display:grid;gap:18px}
.hb-kpi{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--ink);background:var(--panel)}
.hb-kpi>div{padding:12px 14px 10px;display:grid;gap:2px;align-content:start}
.hb-kpi>div+div{border-left:1px solid var(--line)}
.hb-kpi b{font-size:40px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.hb-kpi b small{font-size:15px;font-weight:400;margin-left:3px}
.hb-kpi span{font-size:13px}
.hb-kpi i{font-style:normal;font-size:11px;color:var(--mute)}
.hb-kpi .me{background:var(--acc-soft)}
.hb-kpi .me b{color:var(--accent)}
.stt{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap;border:1px solid var(--ink);padding:0 7px;background:var(--bg)}
.stt i{width:8px;height:8px;flex:none;background:var(--ok)}
.stt.me{border-color:var(--accent);color:var(--accent)} .stt.me i{background:var(--accent)}
.stt.warn i{background:var(--warn)}
.prog{display:inline-flex;gap:3px;vertical-align:-1px;margin:0 4px}
.prog i{width:10px;height:10px;border:1px solid var(--ink);display:inline-block}
.prog i.f{background:var(--ink)} .prog i.n{background:var(--ok);border-color:var(--ok)}
.gantt{border:1px solid var(--ink);background:var(--panel);padding:10px 14px 8px}
.gantt svg{display:block;width:100%;height:auto;overflow:visible}
.gantt text{font-family:var(--mono);fill:var(--ink)}
.gantt .tm{fill:var(--mute)}
.gantt .grid{stroke:var(--line);stroke-dasharray:2 3}
.gantt .axis{stroke:var(--ink)}
.gantt .run-cc{fill:var(--ink)} .gantt .run-cx{fill:var(--mid)}
.gantt .rev{fill:url(#hatch2);stroke:var(--ink)}
.gantt .waitme{fill:var(--acc-soft);stroke:var(--accent);stroke-dasharray:4 3}
.gantt .mk-sec{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.gantt .mk-ok{fill:var(--ok);stroke:var(--panel);stroke-width:2}
.gantt .mk-stop{stroke:var(--warn);stroke-width:2.5}
.gantt .mk-me{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.gantt .mk-out{fill:var(--ink)}
.gantt .on{fill:var(--bg);font-weight:700}
.gantt .lane{fill:var(--chip);opacity:.5}
.gantt .hit:hover{opacity:.8}
.lg{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px;align-items:center}
.lg span{display:inline-flex;gap:6px;align-items:center}
.lg svg{width:22px;height:12px;flex:none}
.gen{font-size:11px;color:var(--mute)}
.mlg{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap}
mark.mkd{background:var(--acc-soft);color:inherit;padding:1px 3px;box-shadow:inset 0 -2px 0 var(--accent)}
mark.mkn{background:transparent;color:inherit;padding:1px 3px;border-bottom:2px dashed var(--accent)}
u.ac{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.inl{font:inherit;font-size:11px;border:1px solid var(--line);background:var(--bg);color:var(--mute);padding:0 5px;margin:0 2px 0 5px;cursor:pointer;vertical-align:1px;line-height:1.5}
.inl:hover{border-color:var(--ink);color:var(--ink)}
.inl.go{border-color:var(--accent);color:var(--accent)}
.nar article{border-top:1px solid var(--ink);padding:18px 0 26px}
.nar article>header{display:flex;gap:12px;align-items:center}
.nar .no{width:28px;height:28px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;flex:none}
.nar h3{font-size:20px}
.nar .meta{margin-left:auto;font-size:12px;color:var(--mute);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.nar .sign{margin-top:4px}
.nar .adv{color:var(--mute)}
.na .grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:36px;margin-top:14px;align-items:start}
.na dl{margin:0;display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px 16px}
.na dt{font-size:12px;color:var(--mute);letter-spacing:.04em;padding-top:5px;text-align:right}
.na dd{margin:0;font-size:15px;line-height:1.85;max-width:44em}
.na aside{border:1px solid var(--line);padding:12px 14px;display:grid;gap:8px;font-size:14px;background:var(--panel)}
.na aside.need{border-color:var(--accent);background:var(--acc-soft)}
.na aside h4{margin:0;font-size:12px;font-weight:400;color:var(--mute);letter-spacing:.04em}
.na aside.need h4{color:var(--accent)}
.na aside p{font-size:14px;line-height:1.65}
.na aside .adv{font-size:13px}
.na aside .btn{justify-self:start}
.na aside table{border-collapse:collapse;width:100%;font-size:12px;margin-top:4px}
.na aside td{padding:4px 0;border-top:1px dashed var(--line);vertical-align:top}
.na aside td:first-child{color:var(--mute);width:3.4em}
.qstrip{display:grid;grid-template-columns:260px repeat(2,minmax(0,1fr));gap:36px;align-items:center;border:1px solid var(--ink);background:var(--panel);padding:16px 18px}
.qstrip h3{font-size:15px;display:flex;gap:8px;align-items:center}
.qstrip .qh p{font-size:12px;color:var(--mute);margin-top:6px}
.qstrip .qt{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.qstrip .qt b{font-size:22px}
.qstrip .track{height:12px;background:var(--chip);position:relative;margin:6px 0}
.qstrip .track b{position:absolute;top:0;bottom:0}
.qstrip .was{left:0;background:var(--line)}
.qstrip .add{background:var(--ink)}
.qstrip .qs{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}

/* ===== 主栏 + 窄栏 ===== */
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:44px;align-items:start}
.rail{display:grid;gap:34px}

/* 工作流 */
.legend{display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:22px;height:auto}
.wfr{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr);gap:22px;padding:20px 0;border-top:1px solid var(--line);align-items:center}
.wfr:last-of-type{border-bottom:1px solid var(--line)}
.wfr .nm{display:grid;gap:6px;align-content:start;font-size:12px}
.wfr .nm b{font-size:15px}
.wfr .nm .st{display:grid;gap:3px;margin-top:4px}
.wfr .mini{min-width:0}
.wfr .caps{font-size:11px;color:var(--mute);margin-top:8px}
.wfr .caps em{font-style:normal;color:var(--ink)}
.wfr.draft .nm b{color:var(--mute)}
.newwf{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr);gap:22px;border:1px dashed var(--ink);padding:18px;margin-top:22px;background:transparent;text-align:left;width:100%;cursor:pointer;font-size:12px}
.newwf:hover{background:var(--panel)}
.newwf b{font-size:15px}
.tpls{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tpls span{border:1px solid var(--ink);padding:1px 8px;background:var(--panel)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.flow span{border:1px solid var(--ink);padding:1px 8px;background:var(--panel)}
.flow span.hot{border-color:var(--accent);color:var(--accent);font-weight:700}
.flow i{font-style:normal;color:var(--mute)}

/* 窄栏：今日运行 */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--ink);margin-bottom:12px}
.stats div{padding:8px 10px;display:grid;gap:0}
.stats div+div{border-left:1px solid var(--line)}
.stats b{font-size:26px;line-height:1.1;font-weight:700}
.stats span{font-size:11px;color:var(--mute)}
.stats .w b{color:var(--warn)}
.tl{position:relative;height:40px;margin:2px 0 10px}
.tl .axis{position:absolute;left:0;right:0;top:18px;border-top:1px solid var(--ink)}
.tl .tick{position:absolute;top:22px;font-size:10px;color:var(--mute);transform:translateX(-50%)}
.tl .tick::before{content:"";position:absolute;left:50%;top:-7px;height:4px;border-left:1px solid var(--ink)}
.tl .mk{position:absolute;top:13px;width:9px;height:9px;transform:translateX(-50%);background:var(--ok);border:1px solid var(--bg)}
.tl .mk.wfk{top:3px;border-radius:50%}
.tl .mk.warn{background:var(--warn)} .tl .mk.wait{background:var(--bg);border:1.5px solid var(--ink)}
.tl .now{position:absolute;top:-4px;bottom:0;border-left:1.5px solid var(--accent)}
.tl .now b{position:absolute;top:-4px;left:4px;font-size:10px;color:var(--accent);font-weight:700;white-space:nowrap}
.mini-list{list-style:none;margin:0;padding:0;font-size:12px}
.mini-list li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);align-items:center}
.mini-list .tp{font-size:10px;color:var(--mute);border:1px solid var(--line);padding:0 3px;margin-right:4px}
.mini-list .tp.wfk{border-color:var(--ink);color:var(--ink)}
.subhd{font-size:11px;color:var(--mute);letter-spacing:.06em;margin:12px 0 2px}
/* 窄栏：托管 */
.cust{display:grid;gap:12px}
.cust .row{display:grid;gap:6px}
.cust .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cust h4{margin:0;font-size:13px}
.cust p{font-size:11px;color:var(--mute)}
.seg{display:flex;border:1px solid var(--ink);width:max-content;max-width:100%;flex-wrap:wrap}
.seg span{padding:2px 8px;font-size:11px;color:var(--mute)}
.seg span+span{border-left:1px solid var(--line)}
.seg span.on{background:var(--ink);color:var(--bg)}
/* 窄栏：自动化 */
.autos{list-style:none;margin:0;padding:0;font-size:12px}
.autos li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);align-items:center}
.autos li.off{color:var(--mute)}
.autos .r{display:flex;gap:6px;align-items:center;color:var(--mute);white-space:nowrap}
.autos .nm{display:flex;gap:6px;align-items:center;min-width:0}
.autos .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== 等距 SVG ===== */
svg.iso{display:block;height:auto;overflow:visible;max-width:100%}
svg.iso polygon{stroke:var(--ink);stroke-width:1;stroke-linejoin:round}
svg.iso .ft{fill:var(--f-top)} svg.iso .fl{fill:var(--f-l)} svg.iso .fr{fill:var(--f-r)}
svg.iso .ink.ft{fill:var(--ink)} svg.iso .mid.ft{fill:var(--mid)} svg.iso .soft.ft{fill:var(--chip)} svg.iso .hat.ft{fill:url(#hatch2)}
svg.iso .dark.ft{fill:var(--slab-top)} svg.iso .dark.fl,svg.iso .dark.fr{fill:var(--slab)}
svg.iso .acc{stroke:var(--accent)} svg.iso .acc.ft{fill:var(--acc-top)} svg.iso .acc.fl{fill:var(--acc-l)} svg.iso .acc.fr{fill:var(--acc-r)}
svg.iso .ghost{fill:none;stroke:var(--ghost);stroke-dasharray:3 3}
svg.iso .ghosta{fill:none;stroke:var(--accent);stroke-dasharray:3 3;opacity:.7}
svg.iso .hatch{fill:url(#hatch1);stroke:var(--line);stroke-dasharray:2 3}
svg.iso text{font-family:var(--mono);fill:var(--ink)}
svg.iso .tb{font-weight:700} svg.iso .tm{fill:var(--mute)} svg.iso .tacc{fill:var(--accent);font-weight:700} svg.iso .twarn{fill:var(--warn);font-weight:700}
svg.iso .tinv{fill:var(--bg);font-weight:700} svg.iso .ton{fill:var(--on-slab);font-weight:700;letter-spacing:.08em}
svg.iso .dash{fill:none;stroke:var(--ink);stroke-dasharray:3 3;stroke-width:1}
svg.iso .dashm{fill:none;stroke:var(--ghost);stroke-dasharray:2 3;stroke-width:1}
svg.iso .seg-acc{fill:none;stroke:var(--accent);stroke-width:2.2}
svg.iso .cl{fill:none;stroke:var(--accent);stroke-width:1.2}
svg.iso .dacc{fill:var(--accent)} svg.iso .dink{fill:var(--ink)}
svg.iso .pin{fill:var(--ink)} svg.iso .pinw{fill:var(--warn)}
svg.iso .led-ok{fill:var(--ok)} svg.iso .led-warn{fill:var(--warn)}
@media (prefers-reduced-motion:no-preference){
  .lift{animation:bob 3.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-4px)}}
}

/* ---------- 协同页（11-19 定稿：工作流泳道 + 规则接在下面；自动化按负责人分组） ---------- */
.cb{display:grid;gap:52px}
.cb-bad{color:var(--bad)}
.cb-out{display:inline-block;border:1px solid var(--ink);background:var(--bg);padding:0 6px;font-size:12px;white-space:nowrap}
.cb-rules{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start;border:1px solid var(--ink);background:var(--panel);padding:12px 16px;margin-bottom:18px}
.cb-rules .lb{font-size:12px;background:var(--ink);color:var(--bg);padding:1px 8px;white-space:nowrap}
.cb-rules ol{margin:0;padding:0;list-style:none;counter-reset:r;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 28px;font-size:13px}
.cb-rules li{counter-increment:r;padding-left:1.6em;position:relative}
.cb-rules li::before{content:counter(r);position:absolute;left:0;color:var(--mute);font-size:12px}
.cb-tabs{display:flex;border:1px solid var(--ink);margin-bottom:18px}
.cb-tabs button{flex:1;border:0;border-right:1px solid var(--ink);background:var(--panel);padding:8px 10px;font-size:14px;font-weight:700;cursor:pointer;text-align:left}
.cb-tabs button:hover{background:var(--chip)}
.cb-tabs button:last-child{border-right:0;flex:0 0 auto;font-weight:400;color:var(--mute)}
.cb-tabs button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.cb-tabs small{display:block;font-weight:400;font-size:11px;opacity:.7}
.cb-tabs em{font-style:normal;font-weight:400;font-size:11px;background:var(--accent);color:var(--on-accent);padding:0 5px;margin-left:8px}
.cb-wfh{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start;margin-bottom:16px}
.cb-wfh h3{font-size:20px;font-weight:800}
.cb-wfh h3 .flag{margin-left:10px;vertical-align:3px;font-weight:400}
.cb-wfh p{font-size:13px;margin-top:6px;line-height:1.65}
.cb-ver{font-size:12px;font-weight:400;border:1px solid var(--ink);padding:0 6px;margin-left:10px;vertical-align:3px}
.cb-meta{margin:0;display:grid;grid-template-columns:1fr 1.15fr .9fr;border:1px solid var(--line);background:var(--panel)}
.cb-meta>div{padding:9px 12px;border-right:1px dashed var(--line)}
.cb-meta>div:last-child{border-right:0}
.cb-meta dt{font-size:12px;color:var(--mute);margin-bottom:3px}
.cb-meta dd{margin:0;font-size:13px;line-height:1.6}
.cb-meta ol{margin:0;padding-left:1.4em}
.cb-modbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--bg);border:1px solid var(--ink);border-bottom:0;padding:7px 10px;font-size:12px}
.cb-modbar .lb{background:var(--ink);color:var(--bg);padding:1px 8px;margin-right:4px}
.cb-mod{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--ink);background:var(--panel);padding:2px 7px;cursor:grab;user-select:none}
.cb-mod:hover{background:var(--f-top)}
.cb-mod i{font-style:normal;color:var(--mute)}
.cb-jmp{margin-left:auto;border:1px solid var(--ok);color:var(--ok);background:transparent;font-size:12px;padding:1px 9px;cursor:pointer}
.cb-jmp.no{border-color:var(--bad);color:var(--bad)}
.cb-swim{display:grid;position:relative;border:1px solid var(--ink);background:var(--panel)}
.cb-swim .hc{display:flex;justify-content:space-between;align-items:center;gap:6px;white-space:nowrap;font-size:12px;color:var(--mute);padding:5px 10px;border-bottom:1px solid var(--ink);border-left:1px dashed var(--line)}
.cb-swim .hc:first-child{border-left:0}
.cb-swim .hc.add{justify-content:center}
.cb-mv{display:inline-flex;gap:3px}
.cb-mv button{border:1px solid var(--line);background:transparent;min-width:18px;height:18px;line-height:1;font-size:11px;cursor:pointer;padding:0 4px;color:var(--ink)}
.cb-mv button:hover:not(:disabled){border-color:var(--ink);background:var(--chip)}
.cb-mv button:disabled{opacity:.3;cursor:default}
.cb-swim .ln{display:flex;gap:8px;align-items:center;padding:0 10px;font-size:13px;border-top:1px dashed var(--line);border-right:1px solid var(--ink);background:var(--bg)}
.cb-swim .ln svg{width:24px;height:auto;flex:none}
.cb-swim .ln.me,.cb-cell.me{background:var(--acc-soft)}
.cb-cell{min-height:66px;border-top:1px dashed var(--line);border-left:1px dashed var(--line);padding:8px 10px;display:grid;align-items:center}
.cb-cell.add,.cb-swim .rc.add{padding:0;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px)}
.cb-blk{position:relative;z-index:1;border:1px solid var(--ink);background:var(--f-top);padding:6px 9px;cursor:grab;display:grid;gap:2px;user-select:none}
.cb-blk b{font-size:13.5px;line-height:1.3}
.cb-blk>span{font-size:11px;color:var(--mute)}
.cb-blk .cb-out{font-size:11px;padding:0 4px}
.cb-blk.me{border-color:var(--accent)}
.cb-blk.bad{border-color:var(--bad);box-shadow:inset 0 3px 0 var(--bad)}
.cb-swim.draft .cb-blk{border-style:dashed}
.cb-swim .rl{font-size:12px;color:var(--mute);padding:10px;border-top:1px dashed var(--line);border-right:1px solid var(--ink);background:var(--bg)}
.cb-swim .rc{padding:10px 12px;border-top:1px dashed var(--line);border-left:1px dashed var(--line);font-size:13px;line-height:1.65;background:var(--bg);min-width:0}
.cb-swim .rc.me{background:var(--acc-soft)}
.cb-swim .rl.first,.cb-swim .rc.first{border-top:1px solid var(--ink)}
.cb-swim .rc.bad.first{box-shadow:inset 0 3px 0 var(--bad)}
.cb-swim .rc ol{margin:0;padding-left:1.5em}
.cb-wire{position:absolute;left:0;top:0;pointer-events:none}
.cb-wire path{fill:none;stroke:var(--ink);stroke-width:1.3}
.cb-wire path.hd{fill:var(--ink);stroke:none}
.cb-dragging{opacity:.35}
.cb-drop{background:var(--acc-soft)!important;outline:1.5px dashed var(--accent);outline-offset:-3px}
.cb-ghost{position:fixed;z-index:99;pointer-events:none;background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:13px;font-weight:700;padding:3px 10px;border:1px solid var(--bg)}
.cb-msg{margin-top:10px;font-size:13px;color:var(--bad);border:1px solid var(--bad);padding:6px 12px}
.cb-chg{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:14px 18px;margin-top:14px;display:grid;gap:10px}
.cb-chg .hd{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.cb-chg .hd b{font-size:15px}
.cb-chg .hd span{font-size:12px;opacity:.8}
.cb-chg .cmp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;align-items:center;font-size:12px}
.cb-chg .lb{opacity:.7}
.cb-chg .ch{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.cb-chg .ch span{background:var(--bg);color:var(--ink);padding:1px 7px;display:inline-flex;gap:6px;align-items:center}
.cb-chg .ch.old span{opacity:.6}
.cb-chg .ch i{font-style:normal;opacity:.7}
.cb-chg .bts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cb-chg .btn{border-color:var(--bg);color:var(--bg)}
.cb-chg .btn:hover{background:transparent;text-decoration:underline}
.cb-chg .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cb-chg .btn:disabled{opacity:.45;cursor:not-allowed;text-decoration:none}
.cb-chg .tip{font-size:12px;opacity:.8}
.cb-chg.sent{background:var(--panel);color:var(--ink);grid-template-columns:minmax(0,1fr) auto;align-items:center}
.cb-chg.sent .btn{border-color:var(--ink);color:var(--ink)}
.cb-chk{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13px}
.cb-chk li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;line-height:1.55}
.cb-chk i{font-style:normal;color:var(--ok);font-weight:700}
.cb-chk li.no,.cb-chk li.no i{color:var(--accent)}
.cb-og+.cb-og{margin-top:18px}
.cb-og .oh{display:flex;gap:10px 16px;align-items:center;padding:8px 12px;background:var(--ink);color:var(--bg);font-size:12px}
.cb-og .oh b{font-size:14px}
.cb-og .oh .code{color:var(--ink)}
.cb-og .oh .code.ink,.cb-og .oh .code.mid,.cb-og .oh .code.none{color:var(--bg);border-color:var(--bg)}
.cb-at{border-collapse:collapse;width:100%;font-size:13px;border:1px solid var(--ink);border-top:0;background:var(--panel);table-layout:fixed}
.cb-at td{padding:9px 12px;border-top:1px dashed var(--line);vertical-align:top;line-height:1.55}
.cb-at tr:first-child td{border-top:0}
.cb-at td:nth-child(2){width:300px}
.cb-at td:nth-child(3){width:200px}
.cb-at td b{font-size:14px}
.cb-at td small{display:block;color:var(--mute);font-size:12px;margin-top:1px}
.cb-at tr.off td{color:var(--mute)}
.cb-at tr.off td b{font-weight:400}
/* ---------- 主线页（11-19 定稿：地铁线） ---------- */
.mx{display:grid;gap:30px}
.mx-ml{border-top:1px solid var(--ink);padding-top:18px}
.mx-mh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center}
.mx-mh .t{display:flex;gap:12px;align-items:baseline;min-width:0;white-space:nowrap}
.mx-mh h3{font-size:20px;font-weight:800}
.mx-mh .t .mute{font-size:12px}
.mx-mh .p{display:flex;gap:10px;align-items:center}
.mx-mh .p b{font-size:16px}
.mx-gl{display:flex;gap:20px;align-items:baseline;justify-content:space-between;margin:6px 0 14px}
.mx-gl p{font-size:13px;max-width:60em}
.mx-gl .o{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);white-space:nowrap}
.mx-bar{display:inline-flex;gap:2px}
.mx-bar i{width:14px;height:14px;border:1px solid var(--ink);background:transparent}
.mx-bar i.s-done{background:var(--ink)}
.mx-bar i.s-run{background:repeating-linear-gradient(135deg,var(--ink) 0 2px,transparent 2px 4px)}
.mx-bar i.blk{border-color:var(--accent);background:repeating-linear-gradient(135deg,var(--accent) 0 2px,transparent 2px 4px)}
.mx-bar i.s-pin{border-style:dashed;border-color:var(--mute)}
.mx-s{display:inline-grid;place-items:center;width:18px;height:18px;border:1px solid var(--ink);font-size:10px;font-weight:700;flex:none;line-height:1}
.mx-s.s-done{background:var(--ink);color:var(--bg)}
.mx-s.s-run{background:var(--bg)}
.mx-s.s-next{border-color:var(--mute)}
.mx-s.s-ask{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mx-s.s-pin{border-style:dashed;color:var(--mute);border-color:var(--mute)}
.mx-s.s-drop{border-color:var(--mute);color:var(--mute)}

const K=0.8660254,H=0.5;
class Iso{
  constructor(){this.p=[];this.b=[1e9,1e9,-1e9,-1e9]}
  pt(x,y,z){const X=(x-y)*K,Y=(x+y)*H-z;this.tr(X,Y);return[X,Y]}
  tr(X,Y){const b=this.b;if(X<b[0])b[0]=X;if(Y<b[1])b[1]=Y;if(X>b[2])b[2]=X;if(Y>b[3])b[3]=Y}
  poly(a,c){this.p.push(`<polygon class="${c}" points="${a.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}"/>`)}
  box(x,y,z,w,d,h,k){
    const t=[this.pt(x,y,z+h),this.pt(x+w,y,z+h),this.pt(x+w,y+d,z+h),this.pt(x,y+d,z+h)];
    const l=[this.pt(x,y+d,z+h),this.pt(x+w,y+d,z+h),this.pt(x+w,y+d,z),this.pt(x,y+d,z)];
    const r=[this.pt(x+w,y,z+h),this.pt(x+w,y+d,z+h),this.pt(x+w,y+d,z),this.pt(x+w,y,z)];
    if(k==='ghost'||k==='ghosta'){this.poly(l,k);this.poly(r,k);this.poly(t,k);return}
    this.poly(l,k+' fl');this.poly(r,k+' fr');this.poly(t,k+' ft');
  }
  tile(x,y,z,w,d,k){this.poly([this.pt(x,y,z),this.pt(x+w,y,z),this.pt(x+w,y+d,z),this.pt(x,y+d,z)],k)}
  top(x,y,z,s,size,c){const[e,f]=this.pt(x,y,z);this.p.push(`<text class="${c}" font-size="${size}" transform="matrix(${K},${H},${-K},${H},${e.toFixed(1)},${f.toFixed(1)})">${s}</text>`)}
  side(x,y,z,s,size,c){const[e,f]=this.pt(x,y,z);this.p.push(`<text class="${c}" font-size="${size}" transform="matrix(${K},${H},0,1,${e.toFixed(1)},${f.toFixed(1)})">${s}</text>`)}
  rside(x,y,z,s,size,c){const[e,f]=this.pt(x,y,z);this.p.push(`<text class="${c}" font-size="${size}" transform="matrix(${K},${-H},0,1,${e.toFixed(1)},${f.toFixed(1)})">${s}</text>`)}
  dot(x,y,z,r,c){const[e,f]=this.pt(x,y,z);this.p.push(`<ellipse class="${c}" cx="${e.toFixed(1)}" cy="${f.toFixed(1)}" rx="${(r*1.2).toFixed(1)}" ry="${(r*.7).toFixed(1)}"/>`)}
  sqTop(x,y,z,s,c){this.poly([this.pt(x,y,z),this.pt(x+s,y,z),this.pt(x+s,y+s,z),this.pt(x,y+s,z)],c)}
  line(a,c){const q=a.map(v=>this.pt(...v));this.p.push(`<path class="${c}" d="M${q.map(v=>v[0].toFixed(1)+' '+v[1].toFixed(1)).join(' L')}"/>`)}
  flat(X,Y,s,size,c){const w=[...s].reduce((a,ch)=>a+(ch.charCodeAt(0)>0x2e80?1:.62),0)*size;this.tr(X,Y-size);this.tr(X+w,Y+4);this.p.push(`<text class="${c}" font-size="${size}" x="${X.toFixed(1)}" y="${Y.toFixed(1)}">${s}</text>`)}
  raw(s){this.p.push(s)}
  svg(pad,label,natural){const b=this.b,w=b[2]-b[0]+pad*2,h=b[3]-b[1]+pad*2;return `<svg class="iso" ${natural?`style="width:${w.toFixed(0)}px"`:''} viewBox="${(b[0]-pad).toFixed(1)} ${(b[1]-pad).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" role="img" aria-label="${label}">${this.p.join('')}</svg>`}
}

function strip(wf){
  const g=new Iso(),s=34,h=16,step=s+12,ghost=wf.state==='draft';
  wf.steps.forEach(([role],i)=>{
    const x=i*step,y=-i*step;
    if(i>0) g.line([[x-step+s,y+step+s/2,0],[x,y+s/2,0]],'dashm');
    roleCube(g,x,y,role,s,h,ghost);
  });
  (wf.pins||[]).forEach(p=>{
    const x=p.at*step,y=-p.at*step; const[X,Y]=g.pt(x+s/2,y+s/2,h); const top=Y-18;
    g.tr(X-30,top-14); g.tr(X+30,top);
    g.raw(`<path class="${p.warn?'pinw':'pin'}" d="M${(X-4).toFixed(1)} ${top.toFixed(1)} L${(X+4).toFixed(1)} ${top.toFixed(1)} L${X.toFixed(1)} ${(top+6).toFixed(1)}Z"/><text x="${X.toFixed(1)}" y="${(top-3).toFixed(1)}" font-size="10" text-anchor="middle" class="${p.warn?'twarn':'tb'}">${p.text}</text>`);
  });
  return g.svg(6,wf.name+' 的角色顺序',true);
}

function dotMatrix(word){
  const F={W:'10001100011000110101101011101110001',O:'01110100011000110001100011000101110',R:'11110100011000111110101001001010001',K:'10001100101010011000101001001010001',B:'11110100011000111110100011000111110',E:'11111100001000011110100001000011111',N:'10001110011010110011100011000110001',C:'01110100011000010000100001000101110',H:'10001100011000111111100011000110001'};
  const st=7,pad=2,cols=word.length*6-1+pad*2,rows=7+pad*2;let out='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const lc=c-pad,lr=r-pad,li=Math.floor(lc/6),lx=lc%6;
    const on=lr>=0&&lr<7&&lc>=0&&li<word.length&&lx<5&&F[word[li]][lr*5+lx]==='1';
    const hot=on&&((c*5+r*3)%17===0), halo=!on&&((c*7+r*11)%29===0);
    out+=`<rect x="${c*st}" y="${r*st}" width="${on?3:1.6}" height="${on?3:1.6}" class="${hot||halo?'dacc':on?'dink':''}" ${on||halo?'':'fill="var(--dot)"'}/>`;
  }
  return `<svg class="iso matrix" viewBox="-2 -2 ${cols*st} ${rows*st}" aria-hidden="true">${out}</svg>`;
}

  const W=1156, L=176, R=14, top=22, rh=big?40:26, bh=big?22:14;
  const lanes=[...NIGHT.tasks.map(t=>({t})),{lab:'秘书替你定'},{lab:'完成的动作'}];
  const H=top+lanes.length*rh+6, x=n=>L+n/600*(W-L-R);
  let o='';
  for(let h=0;h<=10;h++){const X=x(h*60);o+=`<line class="grid" x1="${X}" x2="${X}" y1="${top}" y2="${H-6}"/><text class="tm" x="${X}" y="13" font-size="11" text-anchor="middle">${String((22+h)%24).padStart(2,'0')}:00</text>`}
  o+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${top}" y2="${top}"/>`;

    const y=top+i*rh, cy=y+rh/2;
    if(i%2===0) o+=`<rect class="lane" x="0" y="${y}" width="${W}" height="${rh}"/>`;
    if(ln.t){const t=ln.t;
      o+=`<text x="0" y="${cy+4}" font-size="12"><tspan font-weight="700">${t.n}</tspan>　${t.ref}</text>`;
      t.segs.forEach(s=>{const a=x(mm(s[1])), b=x(mm(s[2])), w=b-a-2;
        const cls=s[0]==='run'?'run-'+t.ex:s[0]==='rev'?'rev':'waitme';
        const name=s[0]==='run'?`${R_NAME(t.ex)} 在做`:s[0]==='rev'?'审查':'等你';
        o+=`<rect class="hit ${cls}" x="${a}" y="${cy-bh/2}" width="${w}" height="${bh}" rx="${s[0]==='run'?2:0}"><title>第 ${t.n} 单 · ${name} · ${s[1]} → ${s[2]}</title></rect>`;
        if(big&&w>(s[0]==='run'?120:70)) o+=`<text class="${s[0]==='run'?'on':''}" x="${a+(s[0]==='wait'?18:7)}" y="${cy+4}" font-size="11">${name}${s[0]==='run'?' '+hm(mm(s[2])-mm(s[1])):''}</text>`;
        if(!big&&s[0]==='wait'&&w>60) o+=`<text x="${a+18}" y="${cy+4}" font-size="10" fill="var(--accent)">等你</text>`;
      });
      t.marks.forEach(mk=>{const X=x(mm(mk[1]));

      });
    } else {
      o+=`<text x="0" y="${cy+4}" font-size="12">${ln.lab}</text>`;
      if(ln.lab.startsWith('秘书')){
        NIGHT.sec.forEach(s=>{const X=x(mm(s.t));o+=`<rect class="mk-sec" x="${X-5}" y="${cy-5}" width="10" height="10" transform="rotate(45 ${X} ${cy})"><title>${s.t} ${s.kind}：${s.a}</title></rect>`+(big?`<text class="tm" x="${X+11}" y="${cy+4}" font-size="11">${s.kind.replace('替你','')}</text>`:'')});
        const X=x(mm(NIGHT.back.t));o+=`<circle class="mk-me" cx="${X}" cy="${cy}" r="6"><title>${NIGHT.back.t} 交回给你</title></circle>`+(big?`<text x="${X+11}" y="${cy+4}" font-size="11" fill="var(--accent)">交回给你</text>`:'');
      } else NIGHT.outMarks.forEach(tm=>{const X=x(mm(tm));o+=`<rect class="mk-out" x="${X-2}" y="${cy-6}" width="4" height="12"><title>${tm}</title></rect>`});
    }
  });
  const lg=`<div class="lg"><span><svg viewBox="0 0 22 12"><rect width="22" height="12" rx="2" fill="var(--ink)"/></svg>Claude Code 在做</span><span><svg viewBox="0 0 22 12"><rect width="22" height="12" rx="2" fill="var(--mid)"/></svg>Codex 在做</span><span><svg viewBox="0 0 22 12"><rect x=".5" y=".5" width="21" height="11" fill="url(#hatch2)" stroke="var(--ink)"/></svg>审查</span><span><svg viewBox="0 0 22 12"><rect x=".5" y=".5" width="21" height="11" fill="var(--acc-soft)" stroke="var(--accent)" stroke-dasharray="4 3"/></svg>等你</span><span><svg viewBox="0 0 22 12"><rect x="6" y="1" width="10" height="10" transform="rotate(45 11 6)" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.5"/></svg>秘书替你定</span><span><svg viewBox="0 0 22 12"><circle cx="11" cy="6" r="5" fill="var(--ok)"/></svg>合并</span><span><svg viewBox="0 0 22 12"><path d="M6 1l10 10M6 11L16 1" stroke="var(--warn)" stroke-width="2.5"/></svg>停下</span><span><svg viewBox="0 0 22 12"><rect x="9" y="0" width="4" height="12" fill="var(--ink)"/></svg>推分支、开 PR、合并、发飞书</span></div>`;
  return `<div class="gantt"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="11-18 夜间时间轴：三单依次执行，秘书四次替你定，一次交回">${o}</svg>${lg}</div>`;

function checks(w){

  bad.length?bad.forEach(t=>out.push({ok:0,text:t})):out.push({ok:1,text:'每一步要用的东西，前面都有人交出'});
  bad=[];let hasBack=0;
  st.forEach((s,i)=>{if(!s.fail[0])return;hasBack=1;const j=st.findIndex(p=>p.id===s.fail[0]);
    if(j<0){bad.push(`第 ${i+1} 步「${s.t}」不过时要退回的那一步被删了`);badAt.add(i)}
    else if(j>i){bad.push(`第 ${i+1} 步「${s.t}」不过时要退回「${st[j].t}」，可它排到后面去了`);badAt.add(i)}});
  bad.length?bad.forEach(t=>out.push({ok:0,text:t})):hasBack&&out.push({ok:1,text:'不过的时候，都退得回前面的步骤'});
  bad=[];let hasRev=0;
  st.forEach((s,i)=>{if(s.k!=='review')return;hasRev=1;const mk=st.slice(0,i).filter(p=>p.k==='make').pop();
    if(mk&&mk.r===s.r){bad.push(`第 ${i+1} 步审的是自己做的东西（都是 ${R[s.r].name}），不算独立审`);badAt.add(i)}});
  bad.length?bad.forEach(t=>out.push({ok:0,text:t})):hasRev&&out.push({ok:1,text:'审的人和做的人不是同一家'});
  st.forEach((s,i)=>{if(s.r==='gp'&&s.k!=='review'){out.push({ok:0,text:`GPT 只接了网页，只能审；第 ${i+1} 步「${s.t}」它做不了`});badAt.add(i)}});
  const mi=st.findIndex(s=>s.k==='merge');
  if(mi>=0){const later=st.findIndex((s,i)=>i>mi&&s.k==='make');
    if(later>=0){out.push({ok:0,text:`合并排在第 ${mi+1} 步，可第 ${later+1} 步还在改东西`});badAt.add(mi)}else out.push({ok:1,text:'合并排在所有改动之后'})}
  return {list:out,badAt,bad:out.filter(c=>!c.ok).length};
}
const needText=(w,i)=>{const s=w.steps[i];return s.need.length?s.need.map(n=>{const j=w.steps.findIndex((p,k)=>k<i&&p.out===n);return j>=0?`第 ${j+1} 步交出的 <b>${n}</b>`:`<b class="cb-bad">${n}（前面没有人交出）</b>`}).join('、'):'从触发直接开始，不用接别人的东西'};

function cbPost(){
  const sw=document.getElementById('cbSwim'),sv=document.getElementById('cbWire');if(!sw||!sv)return;
  const W=sw.offsetWidth,H=sw.offsetHeight;sv.setAttribute('viewBox',`0 0 ${W} ${H}`);sv.setAttribute('width',W);sv.setAttribute('height',H);
  const pos=el=>{let x=0,y=0,e=el;while(e&&e!==sw){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent}return{x,y,w:el.offsetWidth,h:el.offsetHeight}};
  let d='';const n=WF2[state.cw].steps.length;
  for(let i=0;i<n-1;i++){const a=document.getElementById('cbk'+i),b=document.getElementById('cbk'+(i+1));if(!a||!b)continue;
    const p=pos(a),q=pos(b),x1=p.x+p.w,y1=p.y+p.h/2,x2=q.x,y2=q.y+q.h/2,mx=(x1+x2)/2;
    d+=`<path d="M${x1} ${y1}H${mx}V${y2}H${x2-5}"/><path class="hd" d="M${x2-6} ${y2-4}L${x2} ${y2}L${x2-6} ${y2+4}Z"/>`}
  sv.innerHTML=d;
}

let pd=null,noClick=false;

        </div>
      </div>
      <div class="art">${heroArt()}</div>
      <button class="down" type="button" data-jump="decide" aria-label="跳到等我拍板">↓</button>
    </div>
    <div class="foot">
      <div class="matrix">${dotMatrix('WORKBENCH')}</div>
      <div class="go"><p>保存后先进「等我拍板」，确认后才生效</p><button class="btn pri cta" type="button">+ 新建工作流 ⬡</button></div>
    </div>
  </section>

        <div><b>+ 新建工作流</b><div class="tpls"><span>开发</span><span>设计</span><span>评审</span><span>空白</span></div></div>

}
render();

document.addEventListener('click',e=>{
  if(e.target.closest('a[href="#"]')) e.preventDefault();
  const p=e.target.closest('[data-page]'); if(p){state.page=p.dataset.page;render();document.getElementById('main').scrollTop=0;return}
  const u=e.target.closest('.done .undo'); if(u){delete u.closest('[data-done]').dataset.done;return}
  const n=e.target.closest('[data-inl]'); if(n){n.textContent='已发起，去飞书确认';n.disabled=true;return}
  const q=e.target.closest('[data-quick]'); if(q){const r=q.closest('.drow');r.dataset.done='';r.querySelector('.done').innerHTML=`已发起「${SHORT[q.dataset.quick]||q.dataset.quick}」· 待飞书确认`+'<button class="undo" type="button">撤回</button>';return}
  const j=e.target.closest('[data-jump]'); if(j){document.getElementById(j.dataset.jump)?.scrollIntoView({behavior:'smooth'});return}
  const b=e.target.closest('.dc .acts .btn'); if(!b) return;
  if(!b.dataset.pick) return;
  const c=b.closest('.dc'); c.dataset.done=''; c.querySelector('.done').innerHTML=sentText(b.dataset.pick)+'<button class="undo" type="button">撤回</button>';
});
</script>
