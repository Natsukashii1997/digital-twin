# 白名单出口代理（#172）。只做 HTTPS 隧道：CONNECT 到白名单域名的 443；其余一律拒绝。
# 上游只经宿主 8086（never_direct），自己不直接出网；虚拟机防火墙也只放行本容器网段到 8086。
http_port 3128

# 只认执行器的动态地址段（compose ip_range）；backend（.2）也在 agent-net 上，不许用代理（与虚拟机防火墙双层限制）
acl agent_net src 172.30.0.128/25
acl CONNECT method CONNECT
acl port443 port 443
# -n：不做反向解析，IP 形式的目标不会因为 PTR 记录误中白名单
acl allowed dstdomain -n "/etc/squid/allowed_domains.txt"
acl ip_literal dstdom_regex -n ^[0-9.]+$ ^\[ ^[0-9a-fA-F:]+:[0-9a-fA-F:]*$
# 第二道：白名单域名自己解析后，任一地址落在回环、私有、链路本地、CGNAT、组播、保留、虚拟机网段，就拒绝；
# 解析不出地址也拒绝（resolvable 不匹配）。域名白名单是第一道。DNS 经 Docker 内置 DNS → 虚拟机的 1.1.1.1 / 8.8.8.8。
# 局限（README「已知限制」）：真正连目标的是宿主 8086，它会再解析一次；这里拦不住两次解析结果不同。
acl to_internal dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl to_internal dst ::/128 ::1/128 ::ffff:0:0/96 64:ff9b::/96 100::/64 2001:db8::/32 fc00::/7 fe80::/10 ff00::/8
acl resolvable dst 0.0.0.0/0 ::/0

# 顺序要紧：只有通过来源、方法、端口和域名白名单的请求才会走到 dst 检查，非白名单的名字不会被解析
http_access deny ip_literal
http_access deny !CONNECT
http_access deny !port443
http_access deny !agent_net
http_access deny !allowed
http_access deny to_internal
http_access deny !resolvable
http_access allow all

cache_peer 192.168.5.2 parent 8086 0 no-query no-digest default
never_direct allow all

cache deny all
cache_mem 0 MB
pid_filename /run/squid/squid.pid
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0
forwarded_for delete
via off
httpd_suppress_version_string on
coredump_dir /tmp
# 去掉全部权限后打不开 ICMP 套接字，也用不上
pinger_enable off
# docker stop 默认只等 10 秒
shutdown_lifetime 1 seconds
