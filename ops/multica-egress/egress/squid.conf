# 白名单出口代理（#172）。只做 HTTPS 隧道：CONNECT 到白名单域名的 443；其余一律拒绝。
# 上游只经宿主 8086（never_direct），自己不直接出网；虚拟机防火墙也只放行本容器网段到 8086。
http_port 3128

acl agent_net src 172.30.0.0/24
acl CONNECT method CONNECT
acl port443 port 443
# -n：不做反向解析，IP 形式的目标不会因为 PTR 记录误中白名单
acl allowed dstdomain -n "/etc/squid/allowed_domains.txt"
acl ip_literal dstdom_regex -n ^[0-9.]+$ ^\[ ^[0-9a-fA-F:]+:[0-9a-fA-F:]*$

http_access deny ip_literal
http_access deny !CONNECT
http_access deny !port443
http_access allow agent_net allowed
http_access deny all

cache_peer 192.168.5.2 parent 8086 0 no-query no-digest default
never_direct allow all

cache deny all
cache_mem 0 MB
pid_filename /run/squid/squid.pid
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0
forwarded_for delete
via off
httpd_suppress_version_string on
coredump_dir /tmp
# 去掉全部权限后打不开 ICMP 套接字，也用不上
pinger_enable off
# docker stop 默认只等 10 秒
shutdown_lifetime 1 seconds
