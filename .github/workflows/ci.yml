name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04   # ubuntu-latest 11-15 起是 26.04，setup-python 没有 3.9（只有 22.04、24.04）
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'   # Hermes 跑脚本用的是系统自带的 /usr/bin/python3 3.9
      - run: python -B -m unittest discover -s hermes/scripts/tests
      - run: python -B -m unittest discover -s orca/tests
