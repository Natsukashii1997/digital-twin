name: CI
on:
  pull_request:
  push:
    branches: [main]
    # 只改 CURRENT.md 的推送不跑（2026-11-18 常浩定：11 月私有仓库 Actions 免费 2000 分钟用完，
    # digital-twin 推 main 的 157 次里 89 次只改 CURRENT.md，约 400 分钟）。同一次推送还改了别的文件照跑；
    # PR 不受影响：飞书卡片合并要求 PR 有 CI 结果。
    paths-ignore: ['CURRENT.md']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04   # ubuntu-latest 已是 26.04，setup-python 没有 3.9；固定在还有 3.9 的版本
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'   # Hermes 跑脚本用的是系统自带的 /usr/bin/python3 3.9
      # secretary_gate 按 YAML 语义核 Hermes 配置（PR #225），没有 yaml 库就一律交常浩；正式环境 /usr/bin/python3 装的是 6.0.1，CI 对齐
      - run: python -m pip install --disable-pip-version-check pyyaml==6.0.1
      # 0E-2 的监听核对（hub_listener）要用真 lsof 测；Ubuntu 镜像一般自带，没有就装上（L3 第 1 轮 P2-01：不靠跳过）
      - run: command -v lsof || (sudo apt-get update -q && sudo apt-get install -y -q lsof)
      # 两套全量按测试类分片并行跑、汇总成一个结果（常浩 2026-11-20 定提速 B）；任何一片失败或条数对不上整体失败
      - run: python -B scripts/test_all.py
